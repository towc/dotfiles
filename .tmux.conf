set-option -g default-shell /bin/zsh
set-option -g detach-on-destroy on
set-option -sg escape-time 10

set-option -g prefix C-b
bind-key C-b send-prefix

set -g default-terminal "xterm-256color" # italics hack

bind-key -T prefix t set -g status # toggle status bar
bind-key -T prefix v paste-buffer

bind-key -T prefix k run-shell 'tmux switch-client -n \; kill-session -t "#S"'
bind-key -T prefix a command-prompt -p "Session name:" "new-session -s '%1' -n '%1'"
bind-key -T prefix A new-session
bind-key -T prefix c command-prompt -p "Window name:" "new-window -n '%%' -c '#{pane_current_path}'"
bind-key -T prefix C new-window -c '#{pane_current_path}'

# prefix-o: Create obsidian project session - new session, cd to obsidian, open nvim with search
bind-key -T prefix o command-prompt -p "Project:" "new-session -s '%1' -n '%1' -c ~/Documents/obsidian/main 'neovim main.md +\"lua vim.defer_fn(function() vim.cmd([[Obsidian search]]) vim.defer_fn(function() vim.api.nvim_feedkeys(\\\"%1\\\", \\\"n\\\", false) end, 100) end, 100)\"'"
# prefix-O: Same but in current session
bind-key -T prefix O command-prompt -p "Project:" "send-keys 'cd ~/Documents/obsidian/main && neovim main.md +\"lua vim.defer_fn(function() vim.cmd([[Obsidian search]]) vim.defer_fn(function() vim.api.nvim_feedkeys(\\\"%1\\\", \\\"n\\\", false) end, 100) end, 100)\"' Enter"


# Custom 2x2 layout (from window 5)
bind-key -T prefix M-6 select-layout "913e,182x53,0,0[182x46,0,0{90x46,0,0,1,91x46,91,0,4},182x6,0,47{90x6,0,47,6,91x6,91,47,3}]"

set -g window-style 'bg=black'

# Enable mouse support
set -g mouse on

#bind-key -T copy-mode-vi 'v' send -X begin-selection
set-window-option -g mode-keys vi
#bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-\' if-shell "$is_vim" "send-keys 'C-\\'" "select-pane -l"

# https://www.reddit.com/r/tmux/comments/yyqn51/navigate_panes_and_windows_with_the_same_keys/
# doesn't work when in vim at edge of pane, added up and down for sessions
bind-key -n C-h if-shell "$is_vim" "send-keys C-h" { if-shell -F '#{pane_at_left}' "previous-window" "select-pane -L" }
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" { if-shell -F '#{pane_at_right}' "next-window" "select-pane -R" }
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" { if-shell -F '#{pane_at_bottom}' "switch-client -n" "select-pane -D" }
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" { if-shell -F '#{pane_at_top}' "switch-client -p" "select-pane -U" }

bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'sainnhe/tmux-fzf'

set -g @plugin '2kabhishek/tmux2k'
set -g @tmux2k-right-sep ' '
set -g @tmux2k-left-plugins "session"
set -g @tmux2k-right-plugins "network time"
set -g @tmux2k-time-colors "black white"
set -g @tmux2k-time-format "%H:%M %a %d %b"
set -g @tmux2k-network-colors "black white"

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-process 'v vi vim nvim "~astro dev"'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
